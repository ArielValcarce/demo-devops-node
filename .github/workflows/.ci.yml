name: Node CI

on:
  push:
    braches:
      - main
      - github-actions
  
  pull_request:
    branches:
      - main
  
  jobs:

    test:

      runs-on: ubuntu-latest

      steps:

        - name: Descargar repositorio
          uses: actions/checkout@v4

        - name: Configurar Node
          uses: actions/setup-node@v4
          with:
          node-version: 24

        - name: Instalar dependencias
          run: npm CI

        - name: Ejecutar tests
          run: npm test